<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>忍杀情报站 · 本机后台</title><link rel="stylesheet" href="/admin.css"><script type="module" src="/admin.js"></script></head>
<body><header><div><small>NINJA SLAYER INTEL / LOCAL</small><h1>本机后台</h1></div><nav aria-label="后台导航"><a href="#feedback">玩家来信</a><a href="#copy">网页文案</a><a href="/">统计与连接设置 ↗</a></nav></header>
<main><p id="status" role="status">正在读取本机后台…</p>
<section id="feedback"><div class="section-title"><div><small>01 / INBOX</small><h2>玩家来信</h2><p>完整正文、截图与文件仅通过本机后台查看。</p></div><button id="refresh">同步玩家反馈</button></div>
<p id="feedback-state"></p><div class="columns"><aside><label for="feedback-search">搜索来信</label><input id="feedback-search" type="search" placeholder="正文、类别、版本或编号"><div id="feedback-list" class="list"></div></aside><article id="feedback-detail" aria-live="polite"><p>从左侧选择一封来信。</p></article></div></section>
<section id="copy"><div class="section-title"><div><small>02 / COPY DESK</small><h2>网页文案</h2><p>编辑中、英、日三语文字。卡牌规则仍来自游戏目录。</p></div></div>
<div class="toolbar"><button id="save">保存草稿</button><a id="preview" href="/preview/" target="_blank" rel="noopener">预览已保存草稿 ↗</a><button id="publish">发布到官网</button><button id="continue">检查 CI 并继续发布</button></div>
<p id="publication" role="status"></p><p>发布仅提交文案文件，经过 GitHub PR 与 CI 后合并；合并后由 Pages 部署。</p>
<div class="columns"><aside><label for="copy-search">搜索原文</label><input id="copy-search" type="search" placeholder="标题、按钮、图表说明…"><div id="copy-list" class="list"></div></aside><article><p id="copy-key"></p><form id="copy-form"><label for="copy-zhs">简体中文</label><textarea id="copy-zhs" rows="4" maxlength="5000"></textarea><label for="copy-eng">English</label><textarea id="copy-eng" rows="4" maxlength="5000"></textarea><label for="copy-jpn">日本語</label><textarea id="copy-jpn" rows="4" maxlength="5000"></textarea><button type="button" id="reset">恢复本条默认文案</button><p id="dirty"></p></form></article></div></section>
</main><footer>仅监听 127.0.0.1 · 关闭网页不会停止本机服务 · 私有附件不会进入官网</footer></body></html>
