name: Public observatory

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/observatory.yml'
      - 'Infrastructure/telemetry-worker/**'
      - 'NinjaSlayer/localization/zhs/cards.json'
      - 'Tests/NinjaSlayer.OrbContractTests/card-metadata.json'
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Build public snapshot
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
          POSTHOG_QUERY_HOST: ${{ secrets.POSTHOG_QUERY_HOST }}
          OBSERVATORY_READ_TOKEN: ${{ secrets.OBSERVATORY_READ_TOKEN }}
          OBSERVATORY_PREVIOUS_URL: https://2223m1.github.io/NinjaSlayer/data.json
        run: node Infrastructure/telemetry-worker/dashboard/build-pages.mjs build/pages
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: build/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
