name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell7:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: PowerShell 7 contracts
        shell: pwsh
        run: ./tools/test-compatibility-powershell.ps1

  validate:
    if: ${{ always() }}
    needs: powershell7
    runs-on: ubuntu-latest
    steps:
      - name: Require PowerShell 7 contracts
        if: ${{ needs.powershell7.result != 'success' }}
        run: |
          echo 'PowerShell 7 contract job must succeed.' >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Setup .NET 9
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 9.0.x

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Infrastructure/telemetry-worker/package-lock.json

      - name: Repository consistency
        run: |
          node tools/sync-compatibility.mjs --check
          node tools/validate-repository.mjs

      - name: Tutorial mirror contracts
        run: python3 tools/test-tutorial-sync.py

      - name: Pure logic tests
        run: dotnet test Tests/NinjaSlayer.LogicTests/NinjaSlayer.LogicTests.csproj -c Release -v:minimal

      - name: Roslyn architecture tests
        run: dotnet test Tests/NinjaSlayer.ArchitectureTests/NinjaSlayer.ArchitectureTests.csproj -c Release -v:minimal

      - name: Build delivery boundaries
        run: node tools/test-build-boundaries.mjs

      - name: Process network isolation contracts
        shell: pwsh
        run: |
          dotnet build Tests/NinjaSlayer.NetworkIsolationProbe/NinjaSlayer.NetworkIsolationProbe.csproj -c Release -v:minimal
          ./tools/test-process-network-isolation.ps1

      - name: Release artifact contracts
        shell: pwsh
        run: ./tools/test-release-artifacts.ps1

      - name: Worker install and tests
        working-directory: Infrastructure/telemetry-worker
        run: |
          npm ci
          npm test
          npm audit --omit=dev
          npx wrangler deploy --dry-run
