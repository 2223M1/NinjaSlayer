name: GitHub Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: New stable SemVer tag at the current origin/main HEAD
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: [self-hosted, Windows, X64, ninjaslayer-release]
    environment: release-production
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Checkout complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
          set-safe-directory: false

      - name: Validate new release tag at origin/main HEAD
        id: release
        shell: powershell
        run: |
          if ('${{ github.ref }}' -cne 'refs/heads/main') {
            throw 'The protected Release workflow must be dispatched from main.'
          }
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Release tags must use stable SemVer: vMAJOR.MINOR.PATCH without leading zeroes.'
          }
          git show-ref --verify --quiet "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Release tag $env:RELEASE_TAG does not exist." }
          $releaseSha = (git rev-list -n 1 $env:RELEASE_TAG).Trim().ToLowerInvariant()
          if ((git rev-parse HEAD).Trim().ToLowerInvariant() -ne $releaseSha) {
            throw 'The checked-out commit does not match the release tag.'
          }
          git fetch origin main --no-tags
          $originMain = (git rev-parse origin/main).Trim().ToLowerInvariant()
          if ($releaseSha -ne $originMain) {
            throw "Release tag $env:RELEASE_TAG must point to current origin/main HEAD $originMain."
          }
          $workflowSha = '${{ github.sha }}'.ToLowerInvariant()
          if ($workflowSha -ne $releaseSha) {
            throw "The workflow head $workflowSha does not match release commit $releaseSha."
          }
          "RELEASE_SHA=$releaseSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "release_sha=$releaseSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Require an immutable new GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_POLICY_TOKEN: ${{ secrets.RELEASE_POLICY_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_POLICY_TOKEN)) {
            throw 'release-production must provide RELEASE_POLICY_TOKEN with read access to repository administration settings.'
          }
          . .\.github\scripts\actions-provenance.ps1
          $context = New-NinjaSlayerGitHubApiContext `
            -Repository '${{ github.repository }}' `
            -Token $env:RELEASE_POLICY_TOKEN
          Assert-NinjaSlayerImmutableReleasesEnabled -Context $context | Out-Null
          if (Test-NinjaSlayerGitHubReleaseExists -Context $context -Tag $env:RELEASE_TAG) {
            throw "GitHub Release $env:RELEASE_TAG already exists and is immutable."
          }

      - name: Require protected dual-host Contract and smoke
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .\.github\scripts\verify-contract-attestation.ps1 `
            -CandidateSha $env:RELEASE_SHA `
            -Repository '${{ github.repository }}' `
            -Token $env:GH_TOKEN `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'contract-attestation')
          .\.github\scripts\verify-smoke-attestation.ps1 `
            -CandidateSha $env:RELEASE_SHA `
            -Repository '${{ github.repository }}' `
            -Token $env:GH_TOKEN `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'smoke-attestation') `
            -ExpectedMode FirstCombatRestart

      - name: Setup .NET 9
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 9.0.x

      - name: Validate isolated dual-host release inputs
        shell: powershell
        run: |
          . .\.github\scripts\compatibility.ps1
          if ([string]::IsNullOrWhiteSpace($env:GODOT_EXE) -or -not (Test-Path -LiteralPath $env:GODOT_EXE -PathType Leaf)) {
            throw 'The ephemeral release runner did not provide a valid GODOT_EXE.'
          }
          if ([string]::IsNullOrWhiteSpace($env:NINJASLAYER_SPINE_DIR)) {
            throw 'The ephemeral release runner did not provide NINJASLAYER_SPINE_DIR.'
          }
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $compatibility = Read-NinjaSlayerCompatibility -Path '.\eng\compatibility.json'
          $roots = @{
            stable = $env:NINJASLAYER_STS2_STABLE_DATA_DIR
            preview = $env:NINJASLAYER_STS2_PREVIEW_DATA_DIR
          }
          $hosts = foreach ($channelName in @($compatibility.channels.PSObject.Properties.Name)) {
            $profile = Get-NinjaSlayerCompatibilityChannel -Manifest $compatibility -Channel $channelName
            $dataDirectory = $roots[$channelName]
            if ([string]::IsNullOrWhiteSpace($dataDirectory)) {
              throw "The ephemeral release runner did not provide $channelName references."
            }
            $resolved = [IO.Path]::GetFullPath($dataDirectory)
            if ($resolved.StartsWith($workspace, [StringComparison]::OrdinalIgnoreCase)) {
              throw "$channelName references must remain outside the repository workspace."
            }
            foreach ($fileName in @('sts2.dll', '0Harmony.dll', 'GodotSharp.dll') + @($profile.runtimeAssemblies)) {
              $file = Get-Item -LiteralPath (Join-Path $resolved $fileName) -ErrorAction Stop
              if (-not $file.IsReadOnly) { throw "$channelName/$fileName must be mounted read-only." }
            }
            $actualMvid = Get-NinjaSlayerGameModuleMvid -AssemblyPath (Join-Path $resolved 'sts2.dll')
            if ($actualMvid -ne [string]$profile.hostContract.moduleMvid) {
              throw "$channelName release host MVID does not match compatibility.json."
            }
            [ordered]@{
              channel = $channelName
              gameApiVersion = [string]$profile.gameApiVersion
              dataDirectory = $resolved
            }
          }
          "RELEASE_HOSTS_JSON=$(ConvertTo-Json -InputObject @($hosts) -Compress)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install verified Spine extension
        shell: powershell
        run: |
          . .\.github\scripts\compatibility.ps1
          . .\.github\scripts\spine-extension.ps1

          $compatibility = Read-NinjaSlayerCompatibility -Path '.\eng\compatibility.json'
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $destination = Join-Path $env:GITHUB_WORKSPACE 'addons\spine\windows'
          Copy-NinjaSlayerVerifiedSpineExtension `
            -Compatibility $compatibility `
            -SourceDirectory $env:NINJASLAYER_SPINE_DIR `
            -DestinationDirectory $destination `
            -ValidateSource {
              param($file, $contract)
              if (-not $file.IsReadOnly -or $file.FullName.StartsWith($workspace, [StringComparison]::OrdinalIgnoreCase)) {
                throw "$($contract.name) must be a read-only input outside the workspace."
              }
            }

      - name: Validate resources and import with preview host
        shell: powershell
        run: |
          node .\tools\sync-compatibility.mjs --check
          node .\tools\validate-repository.mjs
          if (-not (Test-Path '.\addons\spine\windows\libspine_godot.windows.editor.x86_64.dll')) {
            throw 'The Godot 4.5.1 Spine GDExtension is missing.'
          }
          $releaseHosts = ConvertFrom-Json -InputObject $env:RELEASE_HOSTS_JSON
          $preview = $releaseHosts | Where-Object channel -eq 'preview'
          $previousDataDir = $env:Sts2DataDir
          $previousChannel = $env:NinjaSlayerHostChannel
          try {
            $env:Sts2DataDir = [string]$preview.dataDirectory
            $env:NinjaSlayerHostChannel = 'preview'
            & $env:GODOT_EXE --headless --editor --quit --path . --import
            if ($LASTEXITCODE -ne 0) { throw 'Godot resource import failed.' }
          }
          finally {
            $env:Sts2DataDir = $previousDataDir
            $env:NinjaSlayerHostChannel = $previousChannel
          }

      - name: Package stable and preview release archives
        id: package
        shell: powershell
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $buildRoot = Join-Path $env:RUNNER_TEMP 'release-channel-build'
          $protectedRoot = Join-Path $env:RUNNER_TEMP 'protected-release'
          if (Test-Path -LiteralPath $protectedRoot) {
            Remove-Item -LiteralPath $protectedRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $protectedRoot -Force | Out-Null
          $archives = [Collections.Generic.List[string]]::new()
          $archivesByChannel = @{}
          $releaseHosts = ConvertFrom-Json -InputObject $env:RELEASE_HOSTS_JSON
          foreach ($channelHost in $releaseHosts) {
            $channel = [string]$channelHost.channel
            & .\tools\release\Invoke-NinjaSlayerChannelBuild.ps1 `
              -Channel $channel `
              -Version $version `
              -Sts2DataDir "$($channelHost.dataDirectory)" `
              -Target PackageMod `
              -GodotExe "$env:GODOT_EXE" `
              -BuildRoot $buildRoot

            $archive = "NinjaSlayer-$env:RELEASE_TAG-$channel-sts2-$($channelHost.gameApiVersion).zip"
            $archivePath = Join-Path $protectedRoot $archive
            $packageDirectory = Join-Path $buildRoot "$channel\package\NinjaSlayer"
            Compress-Archive -Path (Join-Path $packageDirectory '*') -DestinationPath $archivePath
            $archives.Add($archivePath)
            $archivesByChannel[$channel] = $archivePath
          }
          & .\.github\scripts\new-release-attestation.ps1 `
            -Repository '${{ github.repository }}' `
            -CandidateSha $env:RELEASE_SHA `
            -Tag $env:RELEASE_TAG `
            -WorkflowRunId '${{ github.run_id }}' `
            -StableArchivePath $archivesByChannel.stable `
            -PreviewArchivePath $archivesByChannel.preview `
            -OutputPath (Join-Path $protectedRoot 'release-attestation.json')
          "RELEASE_ARCHIVES=$($archives -join ';')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PROTECTED_RELEASE_DIR=$protectedRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "protected_release_dir=$protectedRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload protected dual-host release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: protected-release-${{ env.RELEASE_TAG }}-${{ steps.release.outputs.release_sha }}
          path: ${{ steps.package.outputs.protected_release_dir }}
          if-no-files-found: error
          retention-days: 90

      - name: Create immutable GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archives = $env:RELEASE_ARCHIVES.Split(';', [StringSplitOptions]::RemoveEmptyEntries)
          if ($archives.Count -ne 2) { throw 'Exactly two release archives are required.' }
          . .\.github\scripts\actions-provenance.ps1
          $context = New-NinjaSlayerGitHubApiContext `
            -Repository '${{ github.repository }}' `
            -Token $env:GH_TOKEN
          if (Test-NinjaSlayerGitHubReleaseExists -Context $context -Tag $env:RELEASE_TAG) {
            throw "GitHub Release $env:RELEASE_TAG appeared during the build and will not be overwritten."
          }
          $arguments = @('release', 'create', $env:RELEASE_TAG) + $archives + @(
            '--verify-tag',
            '--notes-file', '.\Workshop\change-note.md',
            '--title', "NinjaSlayer $env:RELEASE_TAG"
          )
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Creating the immutable GitHub Release failed.' }
