name: Protected real-game smoke

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Reviewed full SHA already present on canonical main
        required: true
        type: string
      mode:
        description: Bounded release smoke or periodic full AutoSlay
        required: true
        default: FirstCombatRestart
        type: choice
        options:
          - FirstCombatRestart
          - FullAutoSlay

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, Windows, X64, ninjaslayer-smoke]
    environment: game-smoke
    timeout-minutes: 140
    steps:
      - name: Checkout trusted harness at workflow SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: trusted
          persist-credentials: false
          set-safe-directory: false

      - name: Validate canonical candidate
        id: candidate
        shell: powershell
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          if ($env:CANDIDATE_SHA -notmatch '^[0-9a-fA-F]{40}$') { throw 'candidate_sha must be a full SHA.' }
          $candidateSha = $env:CANDIDATE_SHA.ToLowerInvariant()
          $workflowSha = $env:WORKFLOW_SHA.ToLowerInvariant()
          if ($candidateSha -cne $workflowSha) {
            throw "candidate_sha $candidateSha must match the workflow SHA $workflowSha."
          }
          git -C trusted remote set-url origin "https://github.com/${{ github.repository }}.git"
          git -C trusted fetch origin main --no-tags
          git -C trusted cat-file -e "$candidateSha^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate is not present in the canonical repository.' }
          git -C trusted merge-base --is-ancestor $candidateSha origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Candidate must already be an ancestor of canonical main.' }
          "sha=$candidateSha" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Checkout candidate without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
          set-safe-directory: false

      - name: Setup .NET 9
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 9.0.x

      - name: Validate protected dual-host smoke inputs
        shell: powershell
        run: |
          . .\trusted\.github\scripts\compatibility.ps1
          $workspaceRoot = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd(
            [IO.Path]::DirectorySeparatorChar,
            [IO.Path]::AltDirectorySeparatorChar)
          $workspacePrefix = $workspaceRoot + [IO.Path]::DirectorySeparatorChar
          foreach ($variable in @('NINJASLAYER_RITSULIB_MOD_DIR', 'NINJASLAYER_SPINE_DIR', 'GODOT_EXE')) {
            $value = [Environment]::GetEnvironmentVariable($variable)
            if ([string]::IsNullOrWhiteSpace($value) -or -not (Test-Path -LiteralPath $value)) {
              throw "The ephemeral smoke runner did not provide $variable."
            }
            $resolvedValue = [IO.Path]::GetFullPath($value).TrimEnd(
              [IO.Path]::DirectorySeparatorChar,
              [IO.Path]::AltDirectorySeparatorChar)
            if ($resolvedValue.Equals($workspaceRoot, [StringComparison]::OrdinalIgnoreCase) -or
                $resolvedValue.StartsWith($workspacePrefix, [StringComparison]::OrdinalIgnoreCase)) {
              throw "$variable must remain outside the repository workspace."
            }
          }
          if (-not ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole(
              [Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'The smoke runner must be elevated for process firewall isolation.'
          }

          $compatibilityPath = Join-Path $env:GITHUB_WORKSPACE 'candidate\eng\compatibility.json'
          $trustedCompatibilityPath = Join-Path $env:GITHUB_WORKSPACE 'trusted\eng\compatibility.json'
          if ((Get-NinjaSlayerCompatibilitySha256 -Path $compatibilityPath) -ne
              (Get-NinjaSlayerCompatibilitySha256 -Path $trustedCompatibilityPath)) {
            throw 'Candidate compatibility.json must match the protected main harness.'
          }
          $compatibility = Read-NinjaSlayerCompatibility -Path $compatibilityPath
          $roots = @{
            stable = $env:NINJASLAYER_SMOKE_STABLE_GAME_ROOT
            preview = $env:NINJASLAYER_SMOKE_PREVIEW_GAME_ROOT
          }
          $hosts = foreach ($channelName in @($compatibility.channels.PSObject.Properties.Name)) {
            $profile = Get-NinjaSlayerCompatibilityChannel -Manifest $compatibility -Channel $channelName
            $gameRoot = $roots[$channelName]
            if ([string]::IsNullOrWhiteSpace($gameRoot) -or -not (Test-Path -LiteralPath $gameRoot -PathType Container)) {
              throw "The ephemeral smoke runner did not provide the $channelName game root."
            }
            $resolvedRoot = [IO.Path]::GetFullPath($gameRoot).TrimEnd(
              [IO.Path]::DirectorySeparatorChar,
              [IO.Path]::AltDirectorySeparatorChar)
            if ($resolvedRoot.Equals($workspaceRoot, [StringComparison]::OrdinalIgnoreCase) -or
                $resolvedRoot.StartsWith($workspacePrefix, [StringComparison]::OrdinalIgnoreCase)) {
              throw "$channelName game root must remain outside the repository workspace."
            }
            foreach ($file in @('SlayTheSpire2.exe', 'SlayTheSpire2.pck', 'data_sts2_windows_x86_64\sts2.dll')) {
              if (-not (Test-Path -LiteralPath (Join-Path $resolvedRoot $file) -PathType Leaf)) {
                throw "$channelName game root is missing $file."
              }
            }
            $actualMvid = Get-NinjaSlayerGameModuleMvid -AssemblyPath (Join-Path $resolvedRoot 'data_sts2_windows_x86_64\sts2.dll')
            if ($actualMvid -ne [string]$profile.hostContract.moduleMvid) {
              throw "$channelName smoke host MVID does not match compatibility.json."
            }
            [ordered]@{ channel = $channelName; gameRoot = $resolvedRoot }
          }
          "SMOKE_HOSTS_JSON=$(ConvertTo-Json -InputObject @($hosts) -Compress)" | Out-File $env:GITHUB_ENV -Append
          "NUGET_PACKAGES=$env:RUNNER_TEMP\smoke-nuget" | Out-File $env:GITHUB_ENV -Append

      - name: Install verified Spine extension
        shell: powershell
        run: |
          . .\trusted\.github\scripts\compatibility.ps1
          . .\trusted\.github\scripts\spine-extension.ps1

          function Assert-NoReparsePointInPath {
            param([Parameter(Mandatory)][string]$Path)

            $currentPath = [IO.Path]::GetFullPath($Path)
            while (-not [string]::IsNullOrWhiteSpace($currentPath)) {
              $current = Get-Item -LiteralPath $currentPath -Force -ErrorAction Stop
              if (($current.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                throw "Protected Smoke input traverses a reparse point: $($current.FullName)"
              }
              $parentPath = Split-Path -Parent $current.FullName
              if ([string]::IsNullOrWhiteSpace($parentPath) -or
                  $parentPath.Equals($currentPath, [StringComparison]::OrdinalIgnoreCase)) {
                break
              }
              $currentPath = $parentPath
            }
          }

          $compatibility = Read-NinjaSlayerCompatibility -Path '.\trusted\eng\compatibility.json'
          $workspaceRoot = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd(
            [IO.Path]::DirectorySeparatorChar,
            [IO.Path]::AltDirectorySeparatorChar)
          $workspacePrefix = $workspaceRoot + [IO.Path]::DirectorySeparatorChar
          $spineRoot = Get-Item -LiteralPath $env:NINJASLAYER_SPINE_DIR -ErrorAction Stop
          if (-not $spineRoot.PSIsContainer) {
            throw 'NINJASLAYER_SPINE_DIR must be a directory.'
          }
          Assert-NoReparsePointInPath -Path $spineRoot.FullName
          $destination = Join-Path $env:GITHUB_WORKSPACE 'candidate\addons\spine\windows'
          Copy-NinjaSlayerVerifiedSpineExtension `
            -Compatibility $compatibility `
            -SourceDirectory $env:NINJASLAYER_SPINE_DIR `
            -DestinationDirectory $destination `
            -ValidateSource {
              param($file, $contract)
              if (-not $file.IsReadOnly) {
                throw "$($contract.name) must be a read-only Smoke input."
              }
              Assert-NoReparsePointInPath -Path $file.FullName
              if ($file.FullName.Equals($workspaceRoot, [StringComparison]::OrdinalIgnoreCase) -or
                  $file.FullName.StartsWith($workspacePrefix, [StringComparison]::OrdinalIgnoreCase)) {
                throw "$($contract.name) must remain outside the repository workspace."
              }
            }

      - name: Run isolated stable and preview smoke
        shell: powershell
        run: |
          $smokeHosts = ConvertFrom-Json -InputObject $env:SMOKE_HOSTS_JSON
          foreach ($channelHost in $smokeHosts) {
            $channel = [string]$channelHost.channel
            & trusted/tools/smoke-harness/Invoke-NinjaSlayerSmoke.ps1 `
              -CandidateSha '${{ steps.candidate.outputs.sha }}' `
              -CandidateRoot "$env:GITHUB_WORKSPACE\candidate" `
              -TrustedRoot "$env:GITHUB_WORKSPACE\trusted" `
              -GameRootDirectory "$($channelHost.gameRoot)" `
              -RitsuLibModDirectory "$env:NINJASLAYER_RITSULIB_MOD_DIR" `
              -GodotExecutable "$env:GODOT_EXE" `
              -OutputDirectory "$env:RUNNER_TEMP\smoke-result\$channel" `
              -Channel $channel `
              -Mode '${{ inputs.mode }}' `
              -Repository '${{ github.repository }}' `
              -RunId '${{ github.run_id }}'
          }

      - name: Upload successful text-only attestation
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: game-smoke-${{ inputs.mode }}-${{ steps.candidate.outputs.sha }}
          path: |
            ${{ runner.temp }}/smoke-result/stable/attestation.json
            ${{ runner.temp }}/smoke-result/preview/attestation.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload sanitized failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: game-smoke-failure-${{ inputs.mode }}-${{ steps.candidate.outputs.sha }}
          path: ${{ runner.temp }}/smoke-result
          if-no-files-found: warn
          retention-days: 14

      - name: Scrub smoke workspace and caches
        if: always()
        shell: powershell
        run: |
          Remove-Item "$env:RUNNER_TEMP\smoke-*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item candidate, trusted -Recurse -Force -ErrorAction SilentlyContinue
