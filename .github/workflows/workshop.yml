name: Publish Steam Workshop

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release stable SemVer tag
        required: true
        type: string
      channel:
        description: Host-specific Workshop channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - preview
      confirmation:
        description: Type the channel/item confirmation shown in the compatibility manifest
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ inputs.channel == 'stable' && 'workshop-production' || 'workshop-preview' }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET 9
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 9.0.x

      - name: Resolve channel and validate confirmation
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          REQUESTED_CHANNEL: ${{ inputs.channel }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if ('${{ github.ref }}' -cne 'refs/heads/main') {
            throw 'The protected Workshop workflow must be dispatched from main.'
          }
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Release tag must use stable SemVer without leading zeroes.'
          }
          . .\.github\scripts\compatibility.ps1
          $compatibilityPath = Join-Path $env:GITHUB_WORKSPACE 'eng\compatibility.json'
          $compatibility = Read-NinjaSlayerCompatibility -Path $compatibilityPath
          $profile = Get-NinjaSlayerCompatibilityChannel `
            -Manifest $compatibility `
            -Channel $env:REQUESTED_CHANNEL
          $itemId = [string]$profile.workshopItemId
          if ([string]::IsNullOrWhiteSpace($itemId)) {
            throw "The $($env:REQUESTED_CHANNEL) Workshop item has not been provisioned in compatibility.json."
          }
          if ($itemId -notmatch '^\d+$') {
            throw "The $($env:REQUESTED_CHANNEL) Workshop item id is invalid."
          }
          $expectedConfirmation = "PUBLISH_NINJASLAYER_$($env:REQUESTED_CHANNEL.ToUpperInvariant())_$itemId"
          if ($env:CONFIRMATION -cne $expectedConfirmation) {
            throw "Invalid confirmation. Expected $expectedConfirmation."
          }

          $releaseSha = (git rev-list -n 1 $env:RELEASE_TAG).Trim().ToLowerInvariant()
          if ((git rev-parse HEAD).Trim().ToLowerInvariant() -ne $releaseSha) {
            throw 'The checked-out commit does not match the release tag.'
          }
          $archiveName = "NinjaSlayer-$env:RELEASE_TAG-$($env:REQUESTED_CHANNEL)-sts2-$($profile.gameApiVersion).zip"
          "RELEASE_SHA=$releaseSha" | Out-File $env:GITHUB_ENV -Append
          "RELEASE_VERSION=$($env:RELEASE_TAG.Substring(1))" | Out-File $env:GITHUB_ENV -Append
          "RELEASE_ARCHIVE_NAME=$archiveName" | Out-File $env:GITHUB_ENV -Append
          "WORKSHOP_CHANNEL=$($env:REQUESTED_CHANNEL)" | Out-File $env:GITHUB_ENV -Append
          "WORKSHOP_ITEM_ID=$itemId" | Out-File $env:GITHUB_ENV -Append
          "WORKSHOP_VISIBILITY=$(if ($env:REQUESTED_CHANNEL -eq 'stable') { '0' } else { '3' })" | Out-File $env:GITHUB_ENV -Append
          "GAME_API_VERSION=$($profile.gameApiVersion)" | Out-File $env:GITHUB_ENV -Append
          "RITSULIB_PACKAGE_ID=$($profile.ritsuLibPackageId)" | Out-File $env:GITHUB_ENV -Append
          "RITSULIB_VERSION=$($compatibility.ritsuLibVersion)" | Out-File $env:GITHUB_ENV -Append

      - name: Require protected dual-host Contract and smoke
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .\.github\scripts\verify-contract-attestation.ps1 `
            -CandidateSha $env:RELEASE_SHA `
            -Repository '${{ github.repository }}' `
            -Token $env:GH_TOKEN `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'contract-attestation')
          .\.github\scripts\verify-smoke-attestation.ps1 `
            -CandidateSha $env:RELEASE_SHA `
            -Repository '${{ github.repository }}' `
            -Token $env:GH_TOKEN `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'smoke-attestation') `
            -ExpectedMode FirstCombatRestart

      - name: Verify protected Release artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .\.github\scripts\verify-release-attestation.ps1 `
            -CandidateSha $env:RELEASE_SHA `
            -Tag '${{ inputs.release_tag }}' `
            -Repository '${{ github.repository }}' `
            -Token $env:GH_TOKEN `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'protected-release')

      - name: Match public Release asset and extract protected archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $protectedDirectory = Join-Path $env:RUNNER_TEMP 'protected-release\verified'
          $protectedArchive = Join-Path $protectedDirectory $env:RELEASE_ARCHIVE_NAME
          $publicDirectory = Join-Path $env:RUNNER_TEMP 'public-release'
          New-Item -ItemType Directory -Path $publicDirectory -Force | Out-Null
          gh release download '${{ inputs.release_tag }}' `
            --pattern $env:RELEASE_ARCHIVE_NAME `
            --dir $publicDirectory
          if ($LASTEXITCODE -ne 0) { throw 'Downloading the public GitHub Release archive failed.' }
          $publicArchive = Join-Path $publicDirectory $env:RELEASE_ARCHIVE_NAME
          $protectedHash = (Get-FileHash -LiteralPath $protectedArchive -Algorithm SHA256).Hash
          $publicHash = (Get-FileHash -LiteralPath $publicArchive -Algorithm SHA256).Hash
          if ($publicHash -ne $protectedHash) {
            throw 'The public GitHub Release asset does not match the protected Release artifact.'
          }

          . .\.github\scripts\release-artifact.ps1
          $null = Read-NinjaSlayerPackageArchive -Path $protectedArchive
          Expand-NinjaSlayerExactZip `
            -ArchivePath $protectedArchive `
            -DestinationPath (Join-Path $env:RUNNER_TEMP 'content') `
            -ExpectedFileNames @('NinjaSlayer.dll', 'NinjaSlayer.json', 'NinjaSlayer.pck', 'SHA256SUMS')

      - name: Verify archive channel contract
        shell: pwsh
        run: |
          dotnet run --project .\tools\artifact-contract\NinjaSlayer.ArtifactContract.csproj `
            --configuration Release --no-launch-profile -- `
            validate-assembly `
            --assembly "$env:RUNNER_TEMP/content/NinjaSlayer.dll" `
            --channel $env:WORKSHOP_CHANNEL `
            --game-api-version $env:GAME_API_VERSION `
            --ritsulib-package-id $env:RITSULIB_PACKAGE_ID `
            --ritsulib-version $env:RITSULIB_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Workshop DLL channel validation failed.' }
          node .\tools\package-contract.mjs validate-manifest `
            --manifest "$env:RUNNER_TEMP/content/NinjaSlayer.json" `
            --version $env:RELEASE_VERSION `
            --min-game-version $env:GAME_API_VERSION `
            --ritsulib-version $env:RITSULIB_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Workshop manifest channel validation failed.' }

      - name: Install SteamCMD
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/steamcmd"
          curl --fail --silent --show-error --location \
            https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/steamcmd"

      - name: Publish selected Workshop item
        shell: bash
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
          CONTENT_DIR: ${{ runner.temp }}/content
          PREVIEW_FILE: ${{ github.workspace }}/Workshop/image.png
          CHANGE_NOTE_FILE: ${{ github.workspace }}/Workshop/change-note.md
          STEAMCMD: ${{ runner.temp }}/steamcmd/steamcmd.sh
        run: bash .github/scripts/publish-workshop.sh
